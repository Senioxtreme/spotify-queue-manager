<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121212"><title>SQM · Admin</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1b1b1b;--muted:#a8a8a8;--green:#1ed760;--line:#303030}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#143b24,var(--bg) 45%);color:#fff;font:15px system-ui,sans-serif;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{color:var(--green);font-weight:800;font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#1b1b1be8;border:1px solid var(--line);border-radius:16px;padding:18px}.wide{grid-column:1/-1}.metric{font-size:28px;font-weight:800}.muted{color:var(--muted)}button{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#07140b;font-weight:800;cursor:pointer}button.secondary{background:#2b2b2b;color:#fff;border:1px solid #444}button.danger{background:#8f3030;color:#fff}.actions{display:flex;flex-wrap:wrap;gap:8px}.queue{display:grid;gap:8px;margin-top:12px}.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:#141414}.item img{width:42px;height:42px;border-radius:6px;object-fit:cover}.item strong,.item span{display:block}.item span{color:var(--muted);font-size:13px}.login{max-width:380px;margin:12vh auto}.login input{width:100%;padding:12px;border:1px solid #444;background:#111;color:#fff;border-radius:10px;margin:12px 0}.error{color:#ff8d8d;min-height:22px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="wrap"><section id="login" class="card login"><h1>Pannello organizzatore</h1><p class="muted">Accesso riservato all'organizzatore dell'evento.</p><form id="login-form"><input id="password" type="password" autocomplete="current-password" placeholder="Password admin" required><button type="submit">Accedi</button></form><p id="login-error" class="error" role="alert"></p></section>
<section id="dashboard" hidden><header class="top"><div><div class="brand">Spotify Queue Manager</div><div class="muted" id="event-name">Pannello admin</div></div><button class="secondary" id="logout">Esci</button></header><div class="grid"><div class="card"><div class="muted">Stato</div><div class="metric" id="playing">—</div></div><div class="card"><div class="muted">Brani in coda</div><div class="metric" id="queue-count">—</div></div><div class="card"><div class="muted">Aggiornamento</div><div class="metric" id="updated">—</div></div><div class="card wide"><h2>Controlli riproduzione</h2><div class="actions"><button data-action="play">Riprendi</button><button data-action="pause" class="secondary">Pausa</button><button data-action="next" class="danger">Brano successivo</button><button id="refresh" class="secondary">Aggiorna</button></div><p id="action-message" class="error" role="status"></p></div><div class="card wide"><h2>Ora in riproduzione</h2><div id="now" class="muted">Nessun brano</div></div><div class="card wide"><h2>Coda Spotify</h2><div id="queue" class="queue"></div></div></div></section></main>
<script>
const $=s=>document.querySelector(s), login=$('#login'), dashboard=$('#dashboard');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt){const r=await fetch('/api/admin/'+path,{...opt,headers:{'Content-Type':'application/json',...(opt?.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Operazione non riuscita');return d}
async function load(){try{const d=await api('status');login.hidden=true;dashboard.hidden=false;$('#playing').textContent=d.isPlaying?'In riproduzione':'In pausa';$('#queue-count').textContent=d.queue.length;$('#updated').textContent=new Date().toLocaleTimeString();$('#now').innerHTML=d.nowPlaying?`<strong>${esc(d.nowPlaying.track)}</strong><span class="muted">${esc(d.nowPlaying.artists)}</span>`:'Nessun brano in riproduzione';$('#queue').innerHTML=d.queue.length?d.queue.map(t=>`<div class="item">${/^https:\/\//.test(t.albumCover||'')?`<img src="${esc(t.albumCover)}" alt="">`:''}<div><strong>${esc(t.track)}</strong><span>${esc(t.artists)}</span></div></div>`).join(''):'<span class="muted">La coda è vuota.</span>'}catch(e){if(e.message.includes('Accesso')){login.hidden=false;dashboard.hidden=true}else $('#action-message').textContent=e.message}}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-error').textContent='';try{await api('login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#password').value='';await load()}catch(err){$('#login-error').textContent=err.message}});
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{try{await api('action',{method:'POST',body:JSON.stringify({action:b.dataset.action})});$('#action-message').textContent='Operazione eseguita.';await load()}catch(e){$('#action-message').textContent=e.message}}));$('#refresh').addEventListener('click',load);$('#logout').addEventListener('click',async()=>{await api('logout',{method:'POST'});login.hidden=false;dashboard.hidden=true});load();setInterval(load,15000);
</script></body></html>
